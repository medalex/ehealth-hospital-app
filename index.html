<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hospital System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f0f4f8; font-size:.92rem; }
    .topbar { background:#1a3a5c; color:#fff; padding:.65rem 1.4rem; display:flex; align-items:center; gap:.8rem; }
    .topbar h1 { font-size:1.05rem; margin:0; font-weight:600; }
    .wrap { max-width:1100px; margin:0 auto; padding:1.4rem; }
    .panel { background:#fff; border-radius:8px; border:1px solid #dde3ea; margin-bottom:1.2rem; overflow:hidden; }
    .panel-head { background:#f0f4f9; border-bottom:1px solid #dde3ea; padding:.5rem 1rem; font-weight:600; font-size:.84rem; color:#1a3a5c; display:flex; justify-content:space-between; align-items:center; }
    .panel-body { padding:1rem; }
    label { font-size:.82rem; font-weight:500; }
    .mono { font-family:monospace; font-size:.75rem; }
    .btn-main { background:#1a3a5c; border-color:#1a3a5c; color:#fff; }
    .btn-main:hover { background:#2e6da4; border-color:#2e6da4; color:#fff; }
    table { font-size:.82rem; }
    .cred-ok { font-size:.72rem; padding:.2em .5em; border-radius:3px; background:#d4edda; color:#155724; font-weight:600; }
    .cred-no { font-size:.72rem; padding:.2em .5em; border-radius:3px; background:#fff3cd; color:#856404; font-weight:600; }
    .pass { color:#155724; font-weight:700; }
    .fail { color:#721c24; font-weight:700; }
  </style>
</head>
<body>
<div class="topbar">
  <span>🏥</span>
  <h1>Hospital Clinical System</h1>
  <span class="ms-auto opacity-75 small">eHealth Demo · Hospital API :3003</span>
</div>

<div class="wrap">

  <!-- DOCTORS -->
  <div class="panel">
    <div class="panel-head">
      Doctors
      <button class="btn btn-outline-secondary btn-sm" onclick="loadDoctors()">↻</button>
    </div>
    <div class="panel-body p-0">
      <table class="table table-sm table-hover mb-0">
        <thead class="table-light"><tr><th>Name</th><th>Specialty</th><th>License</th><th>MFSSIA Registry</th></tr></thead>
        <tbody id="doc-list"></tbody>
      </table>
    </div>
  </div>

  <!-- CREATE PRESCRIPTION -->
  <div class="panel">
    <div class="panel-head">New Prescription — ZKP Proof</div>
    <div class="panel-body">
      <div class="row g-2">
        <div class="col-sm-3">
          <label>Doctor</label>
          <select id="rx-doc" class="form-select form-select-sm"></select>
        </div>
        <div class="col-sm-3">
          <label>Patient ID <small class="text-muted">(from Patient Portal)</small></label>
          <input id="rx-pid" class="form-control form-control-sm" placeholder="UUID">
        </div>
        <div class="col-sm-2">
          <label>Drug</label>
          <select id="rx-drug" class="form-select form-select-sm">
            <option value="105">Metformin</option>
            <option value="103">Penicillin</option>
            <option value="107">Amoxicillin</option>
          </select>
        </div>
        <div class="col-sm-1"><label>Dosage</label><input id="rx-dose" class="form-control form-control-sm" value="8"></div>
        <div class="col-sm-2"><label>Workflow ID</label><input id="rx-wf" type="number" class="form-control form-control-sm" value="77"></div>
      </div>
      <div class="mt-2 d-flex align-items-center gap-2">
        <button class="btn btn-main btn-sm" onclick="createRx()">Sign &amp; Generate ZKP Proof</button>
        <span id="rx-spin" class="d-none text-muted small"><span class="spinner-border spinner-border-sm me-1"></span>Generating proof (10–30s)…</span>
      </div>
      <div id="rx-msg" class="mt-2"></div>
    </div>
  </div>

  <!-- ALLERGIES -->
  <div class="panel">
    <div class="panel-head">
      Patient Allergies
      <button class="btn btn-outline-secondary btn-sm" onclick="loadAllergies()">↻</button>
    </div>
    <div class="panel-body">
      <div class="row g-2 mb-3">
        <div class="col-sm-3">
          <label>Patient ID</label>
          <input id="al-pid" class="form-control form-control-sm" placeholder="UUID">
        </div>
        <div class="col-sm-2">
          <label>Substance</label>
          <select id="al-sub" class="form-select form-select-sm">
            <option value="Penicillin">Penicillin</option>
            <option value="Amoxicillin">Amoxicillin</option>
            <option value="Metformin">Metformin</option>
          </select>
        </div>
        <div class="col-sm-2">
          <label>Code</label>
          <input id="al-snomed" class="form-control form-control-sm" placeholder="372687004 / PCN-001">
        </div>
        <div class="col-sm-2">
          <label>Code system</label>
          <select id="al-sys" class="form-select form-select-sm">
            <option value="SNOMED-CT" selected>SNOMED-CT</option>
            <option value="AllergyDB-Local">AllergyDB-Local</option>
          </select>
        </div>
        <div class="col-sm-3">
          <label>Source</label>
          <input id="al-src" class="form-control form-control-sm" placeholder="Hospital / Clinic name">
        </div>
        <div class="col-sm-2 d-flex align-items-end">
          <button class="btn btn-main btn-sm w-100" onclick="addAllergy()">Add Allergy</button>
        </div>
      </div>
      <div id="al-msg"></div>
    </div>
    <div class="panel-body p-0">
      <table class="table table-sm table-hover mb-0">
        <thead class="table-light"><tr><th>Patient ID</th><th>Substance</th><th>SNOMED</th><th>Source</th><th>Recorded</th><th></th></tr></thead>
        <tbody id="al-list"></tbody>
      </table>
    </div>
  </div>

  <!-- PRESCRIPTIONS LIST -->
  <div class="panel">
    <div class="panel-head">
      Prescriptions
      <button class="btn btn-outline-secondary btn-sm" onclick="loadRx()">↻ Refresh</button>
    </div>
    <div class="panel-body p-0">
      <table class="table table-sm table-hover mb-0">
        <thead class="table-light">
          <tr><th>Date</th><th>Drug</th><th>Dosage</th><th>Patient</th><th>ZKP</th><th>stmtHash</th><th></th></tr>
        </thead>
        <tbody id="rx-list"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const API      = 'http://localhost:3003';
const PHARMACY = 'http://localhost:3004';
const DRUGS    = {103:'Penicillin',105:'Metformin',107:'Amoxicillin'};

const get  = p => fetch(API+p).then(r=>r.json());
const post = (p,b,base=API) => fetch(base+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{if(!r.ok)throw new Error(await errText(r));return r.json();});
// Extracts a human-readable message from an error response: {error} JSON, plain text, or HTTP status fallback.
async function errText(r){const t=await r.text();if(!t)return `HTTP ${r.status}`;try{const j=JSON.parse(t);return j.error||j.title||j.message||t;}catch{return t;}}
const flash = (id,html,t='success') => document.getElementById(id).innerHTML=`<div class="alert alert-${t} p-2 small mb-0">${html}</div>`;

async function loadDoctors(){
  const sel  = document.getElementById('rx-doc');
  const list = document.getElementById('doc-list');
  try {
    const docs = await get('/api/doctors');
    sel.innerHTML = '';
    list.innerHTML = docs.map(d=>{
      sel.innerHTML += `<option value="${d.id}">${d.firstName} ${d.lastName}</option>`;
      return `<tr>
        <td>${d.firstName} ${d.lastName}</td>
        <td>${d.specialty}</td>
        <td class="mono">${d.licenseNumber}</td>
        <td><span class="cred-ok">✓ MFSSIA</span></td>
      </tr>`;
    }).join('');
  } catch(e) {
    list.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-3">Failed to load doctors: ${e.message} <button class="btn btn-sm btn-outline-danger ms-2" onclick="loadDoctors()">Retry</button></td></tr>`;
    throw e;
  }
}

async function loadRx(){
  const list = document.getElementById('rx-list');
  try {
    const rows = await get('/api/prescriptions');
    list.innerHTML = rows.length
      ? rows.map(r=>`<tr>
          <td>${new Date(r.createdAt).toLocaleDateString()}</td>
          <td>${DRUGS[r.drugId]||r.drugId}</td>
          <td>${r.dosage} mg</td>
          <td class="mono" title="${r.patientId}">${r.patientId?.slice(0,8)}…</td>
          <td>${r.outcome===true?'<span class="pass">✓ PASS</span>':r.outcome===false?'<span class="fail">✗ FAIL</span>':'<span class="text-muted">—</span>'}</td>
          <td class="mono text-muted">${r.stmtHash?r.stmtHash.slice(0,14)+'…':'—'}</td>
          <td>${r.outcome===true?`<button class="btn btn-outline-success btn-sm" onclick='send(${JSON.stringify(r)})'>→ Pharmacy</button>`:''}</td>
        </tr>`).join('')
      : '<tr><td colspan="7" class="text-center text-muted py-3">No prescriptions yet</td></tr>';
  } catch(e) {
    list.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-3">Failed to load prescriptions: ${e.message} <button class="btn btn-sm btn-outline-danger ms-2" onclick="loadRx()">Retry</button></td></tr>`;
    throw e;
  }
}

const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

async function createRx(){
  document.getElementById('rx-msg').innerHTML='';
  const pid=document.getElementById('rx-pid').value.trim();
  if(!UUID_RE.test(pid)){flash('rx-msg','Patient ID must be a valid UUID (from Patient Portal)','danger');return;}
  const spin=document.getElementById('rx-spin'); spin.classList.remove('d-none');
  try{
    const r=await fetch(API+'/api/prescriptions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      doctorId:document.getElementById('rx-doc').value,
      patientId:pid,
      drugId:parseInt(document.getElementById('rx-drug').value),
      dosage:document.getElementById('rx-dose').value,
      workflowId:parseInt(document.getElementById('rx-wf').value),
    })});
    const rx=await r.json().catch(()=>({}));
    // 409 — semantic conflict (numeric / terminology) auto-escalated to the DAO
    if(r.status===409){ flash('rx-msg',conflictHtml(rx),'warning'); loadRx(); return; }
    // 403 — MFSSIA access gate (credential / consent)
    if(r.status===403){ flash('rx-msg',accessDeniedHtml(rx.error||'Access denied'),'danger'); return; }
    // Any other non-2xx that is not a ZKP rejection (422) is a real error
    if(!r.ok && r.status!==422) throw new Error(rx.error||rx.title||('HTTP '+r.status));
    // 201 = issued (accepted) · 422 = rejected by ZKP (recorded for audit, NOT issued)
    const ok=rx.outcome===true;
    const stmt=rx.stmtHash?`  stmtHash: <span class="mono">${rx.stmtHash.slice(0,20)}…</span>`:'';
    const reasons=(!ok && Array.isArray(rx.reasons) && rx.reasons.length)
      ? `<div class="small mt-1"><strong>Why:</strong><ul class="mb-0">${rx.reasons.map(x=>`<li>${x}</li>`).join('')}</ul></div>`
      : '';
    const head=ok?'Issued — ZKP <strong>✓ PASS</strong>':'Rejected — ZKP <strong>✗ FAIL</strong> · not issued, not sent to pharmacy';
    flash('rx-msg',`${head}${stmt}${ok?` <button class="btn btn-sm btn-outline-success ms-2" onclick='send(${JSON.stringify(rx)})'>→ Send to Pharmacy</button>`:''}${reasons}`,ok?'success':'warning');
    loadRx();
  }catch(e){flash('rx-msg',accessDeniedHtml(e.message),'danger');}
  finally{spin.classList.add('d-none');}
}

// Renders a semantic-conflict (409) response: the metric/allergy, the DAO proposal opened,
// and a pointer to the DAO console to resolve it.
function conflictHtml(b){
  const what = b.metric ? `metric <strong>${b.metric}</strong>` : (b.substance ? `allergy <strong>${b.substance}</strong>` : 'clinical data');
  const dao = (b.proposalId!=null)
    ? ` Auto-escalated to DAO proposal <strong>#${b.proposalId}</strong> — resolve it in the <a href="http://localhost:3010/dao" target="_blank">DAO console</a>, then re-issue.`
    : '';
  return `⚠ Semantic conflict on ${what}. ${b.error||''}${dao}`;
}

// Renders MFSSIA access-gate denials distinctly (lock + which challenge failed).
function accessDeniedHtml(msg){
  const m = msg || 'Request failed';
  if(/C-DOC-AUTH\b|not in MFSSIA registry/i.test(m))
    return `🔒 <strong>Access denied — Authentication (C-DOC-AUTH)</strong><br><span class="small">${m}</span>`;
  if(/C-DOC-AUTHZ\b|consent/i.test(m))
    return `🔒 <strong>Access denied — Authorization (C-DOC-AUTHZ)</strong><br><span class="small">${m}</span>`;
  if(/MFSSIA/i.test(m))
    return `🔒 <strong>Access denied — MFSSIA gate</strong><br><span class="small">${m}</span>`;
  return m;
}

async function send(rx){
  if(typeof rx==='string') rx=JSON.parse(rx);
  try{
    const r=await post('/api/prescriptions/receive',{
      drugId:rx.drugId, drugName:DRUGS[rx.drugId]||'Unknown',
      dosage:rx.dosage, patientId:rx.patientId,
      stmtHash:rx.stmtHash||'',
      proofJson:rx.proofJson||'{}',
      publicSignalsJson:rx.publicSignalsJson||'[]',
      outcome:rx.outcome||false,
    }, PHARMACY);
    flash('rx-msg',`Sent to pharmacy ✓ — ID: <code>${r.id}</code>`);
  }catch(e){flash('rx-msg','Pharmacy: '+e.message,'danger');}
}

async function loadAllergies(){
  const list = document.getElementById('al-list');
  try {
    const rows = await get('/api/allergies');
    list.innerHTML = rows.length
      ? rows.map(a=>`<tr>
          <td class="mono" title="${a.patientId}">${a.patientId?.slice(0,8)}…</td>
          <td><strong>${a.substance}</strong></td>
          <td class="mono text-muted">${a.snomedCode||'—'}</td>
          <td>${a.source||'—'}</td>
          <td>${new Date(a.recordedAt).toLocaleDateString()}</td>
          <td><button class="btn btn-outline-danger btn-sm" onclick="deleteAllergy('${a.id}')">✕</button></td>
        </tr>`).join('')
      : '<tr><td colspan="6" class="text-center text-muted py-3">No allergy records</td></tr>';
  } catch(e) {
    list.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-3">Failed to load allergies: ${e.message} <button class="btn btn-sm btn-outline-danger ms-2" onclick="loadAllergies()">Retry</button></td></tr>`;
    throw e;
  }
}

async function addAllergy(){
  const pid=document.getElementById('al-pid').value.trim();
  const sub=document.getElementById('al-sub').value.trim();
  const snomed=document.getElementById('al-snomed').value.trim();
  const sys=document.getElementById('al-sys').value;
  const src=document.getElementById('al-src').value.trim();
  if(!UUID_RE.test(pid)){flash('al-msg','Patient ID must be a valid UUID (from Patient Portal)','danger');return;}
  if(!sub){flash('al-msg','Substance is required','danger');return;}
  if(!snomed){flash('al-msg','Code is required','danger');return;}
  if(!src){flash('al-msg','Source is required','danger');return;}
  try{
    await post('/api/allergies',{
      patientId:pid,
      substance:sub,
      snomedCode:snomed,
      codeSystem:sys,
      source:src,
    });
    flash('al-msg',`Allergy <strong>${sub}</strong> added ✓`);
    document.getElementById('al-snomed').value='';
    document.getElementById('al-src').value='';
    loadAllergies();
  }catch(e){flash('al-msg',e.message,'danger');}
}

async function deleteAllergy(id){
  try{
    await fetch(API+'/api/allergies/'+id,{method:'DELETE'});
    loadAllergies();
  }catch(e){flash('al-msg',e.message,'danger');}
}

// Initial load with retries — survives a startup race where an API
// is not ready yet when the page first opens (otherwise lists stayed empty).
function bootstrap(fn, attempts=5, delay=800){
  (async ()=>{ for(let i=0;i<attempts;i++){ try{ await fn(); return; } catch{ await new Promise(r=>setTimeout(r,delay)); } } })();
}
bootstrap(loadDoctors); bootstrap(loadRx); bootstrap(loadAllergies);
</script>
</body>
</html>
